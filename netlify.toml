# Despliegue en Netlify: la tienda y el panel salen como archivos estáticos (dist/) y la API (/api/*) como una función
# (netlify/functions/api.mjs) con la base de datos de ejemplo sincronizada en Netlify Blobs. Ver README.md → «Demo en Netlify».
[build]
  command = "node scripts/build-netlify.mjs"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"

# Direcciones sin extensión
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/embed"
  to = "/embed.html"
  status = 200
